<!DOCTYPE html>
<html>
<head>
    <title>Employee Access Simulator</title>
</head>
<body>
    <h1>Employee Access Simulator</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Access Level</th>
                <th>Request Time</th>
                <th>Room</th>
                <th>Status</th>
                <th>Reason</th>
            </tr>
        </thead>
        <tbody>
            {% for emp in results %}
            <tr>
                <td>{{ emp.id }}</td>
                <td>{{ emp.access_level }}</td>
                <td>{{ emp.request_time }}</td>
                <td>{{ emp.room }}</td>
                <td>{{ emp.status }}</td>
                <td>{{ emp.reason }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
